services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cooperative_voting
      POSTGRES_USER: cooperative_voting
      POSTGRES_PASSWORD: cooperative_voting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooperative_voting"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cooperative_voting
      DB_USERNAME: cooperative_voting
      DB_PASSWORD: cooperative_voting
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
