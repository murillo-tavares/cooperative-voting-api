<svg viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

  <!-- Lifelines -->
  <line x1="80" y1="60" x2="80" y2="420" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="300" y1="60" x2="300" y2="420" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="520" y1="60" x2="520" y2="420" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="740" y1="60" x2="740" y2="420" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"/>

  <!-- Actor headers -->
  <rect x="10" y="20" width="140" height="40" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="80" y="45" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Client</text>

  <rect x="230" y="20" width="140" height="40" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="300" y="45" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">PautaController</text>

  <rect x="450" y="20" width="140" height="40" rx="8" fill="#fbefff" stroke="#c297ef" stroke-width="1.5"/>
  <text x="520" y="45" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">PautaMapper</text>

  <rect x="670" y="20" width="140" height="40" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="740" y="45" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">PautaService</text>

  <!-- Activation bars -->
  <rect x="295" y="100" width="10" height="280" fill="#fff2b8" stroke="#d4a72c" stroke-width="1"/>
  <rect x="515" y="140" width="10" height="40" fill="#f3ddff" stroke="#c297ef" stroke-width="1"/>
  <rect x="735" y="220" width="10" height="40" fill="#c9f4d6" stroke="#4ac26b" stroke-width="1"/>
  <rect x="515" y="300" width="10" height="40" fill="#f3ddff" stroke="#c297ef" stroke-width="1"/>

  <!-- m1: Client -> Controller -->
  <path d="M80 100 H 295" stroke="#1f2328" stroke-width="1.4" marker-end="url(#seqArrow)"/>
  <text x="187" y="93" font-size="11" fill="#1f2328" text-anchor="middle">POST /pautas (JSON)</text>

  <!-- m2: Controller -> Mapper (toEntity) -->
  <path d="M305 140 H 515" stroke="#1f2328" stroke-width="1.4" marker-end="url(#seqArrow)"/>
  <text x="410" y="133" font-size="11" fill="#1f2328" text-anchor="middle">toEntity(request)</text>

  <!-- m3: Mapper --> Controller (Pauta) -->
  <path d="M515 180 H 305" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#seqArrow)"/>
  <text x="410" y="197" font-size="11" fill="#57606a" text-anchor="middle">Pauta (domínio)</text>

  <!-- m4: Controller -> Service (criar) -->
  <path d="M305 220 H 735" stroke="#1f2328" stroke-width="1.4" marker-end="url(#seqArrow)"/>
  <text x="520" y="213" font-size="11" fill="#1f2328" text-anchor="middle">criar(pauta)</text>

  <!-- m5: Service --> Controller (Pauta persistida) -->
  <path d="M735 260 H 305" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#seqArrow)"/>
  <text x="520" y="277" font-size="11" fill="#57606a" text-anchor="middle">Pauta persistida</text>

  <!-- m6: Controller -> Mapper (toResponse) -->
  <path d="M305 300 H 515" stroke="#1f2328" stroke-width="1.4" marker-end="url(#seqArrow)"/>
  <text x="410" y="293" font-size="11" fill="#1f2328" text-anchor="middle">toResponse(pauta)</text>

  <!-- m7: Mapper --> Controller (PautaResponse) -->
  <path d="M515 340 H 305" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#seqArrow)"/>
  <text x="410" y="357" font-size="11" fill="#57606a" text-anchor="middle">PautaResponse</text>

  <!-- m8: Controller --> Client (201 Created) -->
  <path d="M295 380 H 80" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#seqArrow)"/>
  <text x="187" y="397" font-size="11" fill="#57606a" text-anchor="middle">201 Created (JSON)</text>

  <!-- legend -->
  <text x="20" y="445" font-size="10.5" fill="#57606a">barra = ativação em execução · linha tracejada = retorno · o DTO não passa daqui pro Service</text>

  <defs>
    <marker id="seqArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f2328"/>
    </marker>
  </defs>
</svg>
