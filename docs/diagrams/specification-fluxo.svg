<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

  <!-- LEFT: toolbox de critérios -->
  <rect x="20" y="20" width="280" height="36" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="160" y="43" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">PautaSpecifications</text>

  <rect x="20" y="66" width="280" height="50" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.5"/>
  <text x="160" y="86" font-size="10.5" fill="#1f2328" text-anchor="middle">comDataCriacaoMaiorQue(data)</text>
  <text x="160" y="102" font-size="9" fill="#57606a" text-anchor="middle">Specification&lt;Pauta&gt;</text>

  <rect x="20" y="126" width="280" height="50" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.5"/>
  <text x="160" y="146" font-size="10.5" fill="#1f2328" text-anchor="middle">comDataCriacaoMenorQue(data)</text>
  <text x="160" y="162" font-size="9" fill="#57606a" text-anchor="middle">Specification&lt;Pauta&gt;</text>

  <rect x="20" y="186" width="280" height="50" rx="6" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="160" y="206" font-size="10.5" fill="#1f2328" text-anchor="middle">comCodigo(codigo)</text>
  <text x="160" y="222" font-size="9" fill="#2f7a45" text-anchor="middle">novo critério plugado</text>

  <text x="160" y="256" font-size="10" font-style="italic" fill="#57606a" text-anchor="middle">+ um método aqui = + um critério</text>

  <!-- connectors toolbox -> chain -->
  <path d="M300 91 L 460 115" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#specArrow)"/>
  <path d="M300 151 L 460 193" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#specArrow)"/>
  <path d="M300 211 L 460 271" fill="none" stroke="#4ac26b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#specArrowGreen)"/>

  <!-- RIGHT: fluent chain do SpecificationBuilder -->
  <rect x="460" y="20" width="340" height="44" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="630" y="47" font-size="11" fill="#1f2328" text-anchor="middle">new SpecificationBuilder&lt;Pauta&gt;()</text>
  <path d="M630 64 V 86" stroke="#8c959f" stroke-width="1.4" marker-end="url(#specArrow)"/>

  <rect x="460" y="88" width="340" height="54" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.5"/>
  <text x="472" y="108" font-size="9.5" fill="#1f2328">.addIfPresent(dataCriacaoMaiorQue,</text>
  <text x="472" y="124" font-size="9.5" fill="#1f2328">  PautaSpecifications::comDataCriacaoMaiorQue)</text>
  <path d="M630 142 V 164" stroke="#8c959f" stroke-width="1.4" marker-end="url(#specArrow)"/>

  <rect x="460" y="166" width="340" height="54" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.5"/>
  <text x="472" y="186" font-size="9.5" fill="#1f2328">.addIfPresent(dataCriacaoMenorQue,</text>
  <text x="472" y="202" font-size="9.5" fill="#1f2328">  PautaSpecifications::comDataCriacaoMenorQue)</text>
  <path d="M630 220 V 242" stroke="#8c959f" stroke-width="1.4" marker-end="url(#specArrow)"/>

  <rect x="460" y="244" width="340" height="54" rx="6" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="472" y="264" font-size="9.5" fill="#1f2328">.addIfPresent(codigo,</text>
  <text x="472" y="280" font-size="9.5" fill="#1f2328">  PautaSpecifications::comCodigo)  // novo</text>
  <path d="M630 298 V 320" stroke="#8c959f" stroke-width="1.4" marker-end="url(#specArrow)"/>

  <rect x="460" y="322" width="340" height="40" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="630" y="347" font-size="11" fill="#1f2328" text-anchor="middle">.build()</text>
  <path d="M630 362 V 384" stroke="#8c959f" stroke-width="1.4" marker-end="url(#specArrow)"/>

  <rect x="460" y="386" width="340" height="50" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="630" y="406" font-size="10.5" fill="#1f2328" text-anchor="middle">Specification&lt;Pauta&gt; composta (AND)</text>
  <text x="630" y="422" font-size="10" fill="#57606a" text-anchor="middle">→ service.listar(pageable, specification)</text>

  <text x="20" y="454" font-size="10.5" fill="#57606a">para adicionar um filtro: 1) um método novo em PautaSpecifications · 2) um addIfPresent(...) novo no builder</text>

  <defs>
    <marker id="specArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8c959f"/>
    </marker>
    <marker id="specArrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4ac26b"/>
    </marker>
  </defs>
</svg>
