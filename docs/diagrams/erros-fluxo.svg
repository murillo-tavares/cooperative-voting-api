<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="796" y="30" font-size="11" font-style="italic" fill="#8c959f" text-anchor="end">strategy pattern</text>

  <!-- Box A: ConstraintViolationTranslator (context) -->
  <rect x="260" y="20" width="300" height="112" rx="6" fill="#fbefff" stroke="#c297ef" stroke-width="1.5"/>
  <text x="410" y="34" font-size="9.5" fill="#7a5aa3" text-anchor="middle">«context»</text>
  <text x="410" y="50" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">ConstraintViolationTranslator</text>
  <line x1="260" y1="60" x2="560" y2="60" stroke="#c297ef" stroke-width="1"/>
  <text x="270" y="78" font-size="10" fill="#1f2328">- porConstraint: Map&lt;String, Mapper&gt;</text>
  <line x1="260" y1="88" x2="560" y2="88" stroke="#c297ef" stroke-width="1"/>
  <text x="270" y="108" font-size="10" fill="#1f2328">+ traduzir(ex): RuntimeException</text>

  <!-- dependency arrow: Translator -> Interface -->
  <path d="M410 132 V 168" fill="none" stroke="#1f2328" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#umlDepend)"/>
  <text x="424" y="153" font-size="10" fill="#57606a">usa (Map)</text>

  <!-- Box B: ConstraintViolationMapper (strategy interface) -->
  <rect x="260" y="170" width="300" height="100" rx="6" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="410" y="184" font-size="9.5" fill="#2f6db3" text-anchor="middle">«interface»</text>
  <text x="410" y="200" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">ConstraintViolationMapper</text>
  <line x1="260" y1="208" x2="560" y2="208" stroke="#54aeff" stroke-width="1"/>
  <text x="270" y="226" font-size="10" fill="#1f2328">+ constraintName(): String</text>
  <text x="270" y="244" font-size="10" fill="#1f2328">+ mapear(ex): AbstractThrowableProblem</text>

  <!-- realization: Box C -> Interface -->
  <path d="M180 330 C 180 290, 260 270, 328 270" fill="none" stroke="#1f2328" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#umlRealize)"/>

  <!-- realization: Box D -> Interface -->
  <path d="M640 330 C 640 290, 560 270, 492 270" fill="none" stroke="#1f2328" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#umlRealize)"/>

  <!-- Box C: SessaoVotacaoJaAbertaException (concrete strategy, real) -->
  <rect x="30" y="330" width="300" height="110" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="180" y="350" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">SessaoVotacaoJaAbertaException</text>
  <text x="180" y="366" font-size="9.5" font-style="italic" fill="#57606a" text-anchor="middle">extends AbstractThrowableProblem</text>
  <line x1="30" y1="374" x2="330" y2="374" stroke="#d4a72c" stroke-width="1"/>
  <text x="180" y="392" font-size="10" fill="#1f2328" text-anchor="middle">constraintName():</text>
  <text x="180" y="408" font-size="10" fill="#1f2328" text-anchor="middle">"uk_sessao_votacao_pauta"</text>

  <!-- Box D: nova implementação (concrete strategy, extensível) -->
  <rect x="490" y="330" width="300" height="110" rx="6" fill="#eaeef2" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="640" y="350" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">⋯ NovaConstraintException</text>
  <text x="640" y="366" font-size="9.5" font-style="italic" fill="#57606a" text-anchor="middle">extends AbstractThrowableProblem</text>
  <line x1="490" y1="374" x2="790" y2="374" stroke="#8c959f" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="640" y="392" font-size="10" fill="#1f2328" text-anchor="middle">constraintName():</text>
  <text x="640" y="408" font-size="10" fill="#1f2328" text-anchor="middle">"outra_constraint"</text>

  <text x="20" y="452" font-size="10.5" fill="#57606a">contexto delega à estratégia certa via Map · nova constraint = nova implementação, sem tocar no tradutor</text>

  <defs>
    <marker id="umlRealize" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f6f8fa" stroke="#1f2328" stroke-width="1"/>
    </marker>
    <marker id="umlDepend" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1f2328" stroke-width="1.3"/>
    </marker>
  </defs>
</svg>
