openapi: 3.0.3
info:
  title: Cooperative Voting API
  description: API de votação cooperativa. Gerencia pautas submetidas à assembleia.
  version: "1.2.0"

servers:
  - url: /api/v1

tags:
  - name: Pauta
    description: Cadastro e consulta de pautas de votação
  - name: Sessão de Votação
    description: Abertura de sessões de votação em pautas
  - name: Voto
    description: Recebimento de votos numa sessão de votação
  - name: Resultado
    description: Apuração do resultado de votação de uma pauta

paths:
  /pautas:
    post:
      tags: [Pauta]
      summary: Cadastra uma nova pauta
      operationId: criarPauta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PautaRequest"
      responses:
        "201":
          description: Pauta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PautaResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroValidacao"
    get:
      tags: [Pauta]
      summary: Lista pautas com paginação e filtros por data de criação
      operationId: listarPautas
      parameters:
        - name: page
          in: query
          description: Número da página (0-indexed)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Tamanho da página
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: "Campo e direção de ordenação, ex.: dataCriacao,desc"
          schema:
            type: string
        - name: dataCriacaoMaior
          in: query
          description: Filtra pautas criadas após esta data
          schema:
            type: string
            format: date-time
        - name: dataCriacaoMenor
          in: query
          description: Filtra pautas criadas antes desta data
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Página de pautas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PautaPage"

  /pautas/{id}:
    get:
      tags: [Pauta]
      summary: Busca uma pauta pelo id
      operationId: buscarPautaPorId
      parameters:
        - $ref: "#/components/parameters/IdPauta"
      responses:
        "200":
          description: Pauta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PautaResponse"
        "404":
          description: Pauta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
    put:
      tags: [Pauta]
      summary: Atualiza uma pauta existente
      operationId: atualizarPauta
      parameters:
        - $ref: "#/components/parameters/IdPauta"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PautaRequest"
      responses:
        "200":
          description: Pauta atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PautaResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroValidacao"
        "404":
          description: Pauta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
    delete:
      tags: [Pauta]
      summary: Exclui (logicamente) uma pauta existente
      operationId: excluirPauta
      parameters:
        - $ref: "#/components/parameters/IdPauta"
      responses:
        "204":
          description: Pauta excluída
        "404":
          description: Pauta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /pautas/{id}/sessoes:
    post:
      tags: [Sessão de Votação]
      summary: Abre uma sessão de votação para a pauta
      description: >-
        Corpo é opcional. Sem `duracaoSegundos` (ou sem corpo), a sessão fica aberta
        por 1 minuto. Só é permitida uma sessão por pauta.
      operationId: abrirSessaoVotacao
      parameters:
        - $ref: "#/components/parameters/IdPauta"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessaoVotacaoRequest"
      responses:
        "201":
          description: Sessão aberta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoVotacaoResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroValidacao"
        "404":
          description: Pauta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: Sessão de votação já aberta para a pauta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /pautas/{id}/votos:
    post:
      tags: [Voto]
      summary: Registra o voto de um associado na sessão de votação da pauta
      operationId: registrarVoto
      parameters:
        - $ref: "#/components/parameters/IdPauta"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VotoRequest"
      responses:
        "201":
          description: Voto registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotoResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroValidacao"
        "403":
          description: Associado não apto a votar (consulta externa de aptidão)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "404":
          description: Pauta não encontrada, ou nenhuma sessão de votação foi aberta para ela
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: Sessão encerrada, ou associado já votou nesta pauta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /pautas/{id}/resultado:
    get:
      tags: [Resultado]
      summary: Contabiliza os votos de uma pauta e devolve o resultado
      description: >-
        Apura a qualquer momento, mesmo com a sessão ainda aberta (resultado parcial nesse caso).
      operationId: apurarResultadoVotacao
      parameters:
        - $ref: "#/components/parameters/IdPauta"
      responses:
        "200":
          description: Resultado apurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoVotacaoResponse"
        "404":
          description: Pauta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

components:
  parameters:
    IdPauta:
      name: id
      in: path
      required: true
      description: Id (UUID) da pauta
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

  schemas:
    PautaRequest:
      type: object
      required: [titulo]
      properties:
        titulo:
          type: string
          maxLength: 120
          example: Alterar estatuto social
        descricao:
          type: string
          maxLength: 500
          example: Proposta de alteração do estatuto social da cooperativa

    PautaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        titulo:
          type: string
          example: Alterar estatuto social
        descricao:
          type: string
          example: Proposta de alteração do estatuto social da cooperativa
        dataCriacao:
          type: string
          format: date-time
        dataAtualizacao:
          type: string
          format: date-time
          nullable: true

    PautaPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PautaResponse"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Página atual (0-indexed)
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    Erro:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        codigo:
          type: string
          description: Código do erro de negócio (catálogo interno). Ausente em erros de framework/validação.
          nullable: true
          example: PAUTA_NAO_ENCONTRADA
        message:
          type: string
        path:
          type: string

    SessaoVotacaoRequest:
      type: object
      properties:
        duracaoSegundos:
          type: integer
          format: int32
          minimum: 1
          description: Duração da sessão em segundos. Default de 60s (1 minuto) se omitido.
          example: 60

    SessaoVotacaoResponse:
      type: object
      properties:
        pautaId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        dataAbertura:
          type: string
          format: date-time
        dataFechamento:
          type: string
          format: date-time
        status:
          type: string
          enum: [ABERTA, ENCERRADA]

    VotoRequest:
      type: object
      required: [associadoId, opcao]
      properties:
        associadoId:
          type: string
          description: "CPF do associado (obrigatório, precisa ser um CPF válido, com dígitos verificadores corretos)"
          example: "52998224725"
        opcao:
          type: string
          enum: [SIM, NAO]

    VotoResponse:
      type: object
      properties:
        pautaId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        sessaoId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        associadoId:
          type: string
          example: "52998224725"
        opcao:
          type: string
          enum: [SIM, NAO]
        dataVoto:
          type: string
          format: date-time

    ResultadoVotacaoResponse:
      type: object
      properties:
        pautaId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        totalVotosSim:
          type: integer
          format: int64
        totalVotosNao:
          type: integer
          format: int64
        totalVotos:
          type: integer
          format: int64
        resultado:
          type: string
          enum: [APROVADA, REPROVADA, EMPATE]

    ErroValidacao:
      allOf:
        - $ref: "#/components/schemas/Erro"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
